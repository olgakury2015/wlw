<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>告警通知 · 盖斯特控制台</title>
    <link rel="stylesheet" th:href="@{/css/console.css}"/>
</head>
<body class="console-body">
<div class="c-app">
    <aside th:replace="fragments-console :: sidebar"></aside>
    <div class="c-main">
        <header th:replace="fragments-console :: topbar"></header>
        <div class="c-content">
            <div class="c-page-head">
                <h1 class="c-title">告警通知</h1>
                <p class="c-sub">
                    配置<strong>全局兜底 Webhook</strong>（如钉钉自定义机器人）。单条「告警规则」里也可单独填写地址；若规则未填，则使用此处地址发送。
                    场景联动（执行）在条件满足时同样会走通知通道。
                </p>
            </div>
            <div th:if="${msg}" class="c-alert c-alert--ok" th:text="${msg}"></div>
            <div class="c-card">
                <h2 class="c-card__title">全局 Webhook</h2>
                <form sec:authorize="hasRole('ADMIN')" method="post" th:action="@{/alerts/notify}" class="c-form-row" style="flex-direction:column;align-items:stretch;max-width:720px">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <label>钉钉 / 自定义 HTTP 地址
                        <textarea name="fallbackWebhook" rows="3" placeholder="https://oapi.dingtalk.com/robot/send?access_token=..."
                                  th:text="${channel != null && channel.fallbackWebhook != null ? channel.fallbackWebhook : ''}"></textarea>
                    </label>
                    <div class="c-form-actions">
                        <button type="submit" class="c-btn c-btn--primary">保存</button>
                    </div>
                </form>
                <p sec:authorize="!hasRole('ADMIN')" class="c-muted" style="margin:0">
                    当前为只读账号，无法修改通知配置；请联系管理员。
                </p>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="fragments-console :: layout-scripts"></th:block>
</body>
</html>
