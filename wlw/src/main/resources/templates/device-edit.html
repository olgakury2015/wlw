<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>修改设备 · 盖斯特控制台</title>
    <link rel="stylesheet" th:href="@{/css/console.css}"/>
</head>
<body class="console-body">
<div class="c-app">
    <aside th:replace="fragments-console :: sidebar"></aside>
    <div class="c-main">
        <header th:replace="fragments-console :: topbar"></header>
        <div class="c-content">
            <p class="c-muted"><a th:href="@{/devices/{id}(id=${device.id})}">← 返回设备详情</a> · <a th:href="@{/devices}">设备列表</a></p>
            <h1 class="c-title">修改设备</h1>
            <p class="c-sub">设备编号 <code th:text="${device.deviceSn}">SN</code> 为平台身份标识，<strong>不可修改</strong>。</p>

            <div th:if="${msg}" class="c-alert c-alert--ok" th:text="${msg}"></div>
            <div th:if="${error}" class="c-alert c-alert--err" th:text="${error}"></div>

            <div class="c-card">
                <form method="post" th:action="@{/devices/{id}/update(id=${device.id})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="c-form-row" style="margin-bottom:10px">
                        <label>名称 *
                            <input type="text" name="name" required th:value="${device.name}"/>
                        </label>
                        <label>协议 *
                            <select name="protocol" id="protocolSelect">
                                <option value="MQTT" th:selected="${device.protocol == 'MQTT'}">MQTT（设备发布 → 平台订阅 Broker）</option>
                                <option value="HTTP" th:selected="${device.protocol == 'HTTP'}">HTTP</option>
                                <option value="TCP_PULL" th:selected="${device.protocol == 'TCP_PULL'}">TCP 拉取（平台连设备）</option>
                                <option value="TCP_PUSH" th:selected="${device.protocol == 'TCP_PUSH'}">TCP 推送（设备/脚本连平台）</option>
                                <option value="MODBUS-TCP" th:selected="${device.protocol == 'MODBUS-TCP'}">MODBUS-TCP</option>
                                <option value="MODBUS-RTU" th:selected="${device.protocol == 'MODBUS-RTU'}">MODBUS-RTU</option>
                            </select>
                        </label>
                        <label>设备分类
                            <select name="categoryId">
                                <option value="" th:selected="${device.category == null}">— 未分类 —</option>
                                <option th:each="c : ${categories}" th:value="${c.id}"
                                        th:selected="${device.category != null && device.category.id == c.id}"
                                        th:text="${c.name}">分类</option>
                            </select>
                        </label>
                        <label>所属网关
                            <select name="gatewayId">
                                <option value="" th:selected="${device.gateway == null}">— 直连平台 —</option>
                                <option th:each="g : ${gateways}" th:value="${g.id}"
                                        th:selected="${device.gateway != null && device.gateway.id == g.id}"
                                        th:text="${g.name + ' (' + g.gatewaySn + ')'}">网关</option>
                            </select>
                        </label>
                    </div>
                    <div id="tcpPullBlock" class="c-card c-card--nested" style="display:none">
                        <strong style="font-size:14px;color:var(--text)">TCP 采集参数</strong>
                        <div class="c-form-row" style="margin-top:8px">
                            <label>设备 TCP 地址 *
                                <input type="text" name="tcpRemoteHost" th:value="${device.tcpRemoteHost}"/>
                            </label>
                            <label>端口 *
                                <input type="number" name="tcpRemotePort" th:value="${device.tcpRemotePort}" min="1" max="65535"/>
                            </label>
                            <label>返回类型 *
                                <select name="tcpResponseType">
                                    <option value="JSON" th:selected="${device.tcpResponseType == 'JSON'}">JSON</option>
                                    <option value="TEXT" th:selected="${device.tcpResponseType == 'TEXT'}">TEXT</option>
                                </select>
                            </label>
                        </div>
                    </div>
                    <div id="mqttBlock" class="c-card c-card--nested" style="display:none">
                        <strong style="font-size:14px;color:var(--text)">MQTT（平台按本设备信息连接并订阅）</strong>
                        <p class="c-muted" style="font-size:12px;margin:8px 0 0;line-height:1.55">
                            填写后平台为本设备单独建 MQTT 订阅；留空则仅用全局 <code>iot.mqtt</code>。<code>mqtt://</code> 会自动按 <code>tcp://</code> 连接；URI 无端口时请填端口框。Client ID 后台自动生成。修改时密码<strong>留空表示不修改</strong>已存密码。
                        </p>
                        <div class="c-form-row" style="margin-top:10px">
                            <label>Broker 主机 / URI
                                <input type="text" name="mqttRemoteHost" th:value="${device.mqttRemoteHost}" placeholder="192.168.0.50"/>
                            </label>
                            <label>端口
                                <input type="number" name="mqttRemotePort" th:value="${device.mqttRemotePort}" placeholder="1883" min="1" max="65535"/>
                            </label>
                        </div>
                        <label style="display:block;margin-top:8px">订阅主题
                            <input type="text" name="mqttSubscribeTopic" th:value="${device.mqttSubscribeTopic}" placeholder="wlw/devices/+/telemetry" style="width:100%;max-width:520px"/>
                        </label>
                        <div class="c-form-row" style="margin-top:8px">
                            <label>用户名（可选）
                                <input type="text" name="mqttUsername" th:value="${device.mqttUsername}"/>
                            </label>
                            <label>密码（可选）
                                <input type="password" name="mqttPassword" placeholder="不修改请留空" autocomplete="new-password"/>
                            </label>
                        </div>
                    </div>
                    <th:block th:with="addrNote=${device.locationAddress != null ? device.locationAddress : ''}"
                              th:replace="fragments-device-location :: deviceLocationFields(${addrNote})"></th:block>
                    <div class="c-form-row" style="margin-bottom:10px">
                        <label>产品名称
                            <input type="text" name="productName" th:value="${device.productName}"/>
                        </label>
                        <label>机构名称
                            <input type="text" name="orgName" th:value="${device.orgName}"/>
                        </label>
                    </div>
                    <div class="c-form-actions">
                        <button type="submit" class="c-btn c-btn--primary">保存</button>
                        <a class="c-btn c-btn--ghost" th:href="@{/devices/{id}(id=${device.id})}">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    (function () {
        var sel = document.getElementById('protocolSelect');
        var block = document.getElementById('tcpPullBlock');
        var mqttBlock = document.getElementById('mqttBlock');
        function sync() {
            if (block && sel) block.style.display = (sel.value === 'TCP_PULL') ? 'block' : 'none';
            if (mqttBlock && sel) mqttBlock.style.display = (sel.value === 'MQTT') ? 'block' : 'none';
        }
        if (sel) {
            sel.addEventListener('change', sync);
            sync();
        }
    })();
</script>
<th:block th:replace="fragments-device-location :: deviceLocationScripts"></th:block>
<th:block th:replace="fragments-console :: layout-scripts"></th:block>
</body>
</html>
