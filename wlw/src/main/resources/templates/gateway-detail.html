<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>网关详情 · 盖斯特控制台</title>
    <link rel="stylesheet" th:href="@{/css/console.css}"/>
</head>
<body class="console-body">
<div class="c-app">
    <aside th:replace="fragments-console :: sidebar"></aside>
    <div class="c-main">
        <header th:replace="fragments-console :: topbar"></header>
        <div class="c-content">
            <p class="c-muted"><a th:href="@{/devices}">← 返回设备列表</a></p>
            <div th:if="${msg}" class="c-alert c-alert--ok" th:text="${msg}"></div>
            <div th:if="${error}" class="c-alert c-alert--err" th:text="${error}"></div>

            <div class="c-page-head">
                <h1 class="c-title" th:text="${gateway.name}">网关</h1>
                <p class="c-sub">型号档案与 USR-G781 / 通用 DTU 对接说明</p>
            </div>

            <div class="c-grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px">
                <div class="c-card">
                    <h2 class="c-card__title">基本信息</h2>
                    <table class="c-kv-table">
                        <tr><th>编号</th><td><code th:text="${gateway.gatewaySn}">-</code></td></tr>
                        <tr><th>在线</th>
                            <td><span class="c-badge c-badge--on" th:if="${gateway.status == 'ONLINE'}">在线</span>
                                <span class="c-badge c-badge--off" th:if="${gateway.status != 'ONLINE'}">离线</span></td></tr>
                        <tr><th>型号</th><td th:text="${gateway.vendorModel}">-</td></tr>
                        <tr><th>上行协议</th><td th:text="${gateway.uplinkProtocol}">-</td></tr>
                        <tr><th>串口模式</th><td th:text="${gateway.serialMode}">-</td></tr>
                        <tr><th>注册包</th><td th:text="${gateway.registerPacket != null} ? ${gateway.registerPacket} : '—'">-</td></tr>
                        <tr><th>最后上报</th><td th:text="${gateway.lastSeenAt != null} ? ${gateway.lastSeenAt} : '—'">-</td></tr>
                        <tr><th>安装地址</th><td th:text="${gateway.locationAddress != null} ? ${gateway.locationAddress} : '—'">-</td></tr>
                    </table>
                    <div class="c-form-actions" style="margin-top:12px" sec:authorize="hasRole('ADMIN')">
                        <a class="c-btn c-btn--primary" th:href="@{/gateways/{id}/edit(id=${gateway.id})}">修改</a>
                        <form th:action="@{/gateways/delete/{id}(id=${gateway.id})}" method="post" style="display:inline"
                              onsubmit="return confirm('确定删除网关？下挂设备将解除关联。');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="c-btn">删除</button>
                        </form>
                    </div>
                </div>

                <div class="c-card">
                    <h2 class="c-card__title">对接步骤</h2>
                    <p class="c-muted" style="font-size:13px">平台 TCP 推送端口：<strong th:text="${platformTcpPort}">9099</strong></p>
                    <ol style="margin:0;padding-left:20px;font-size:13px;line-height:1.65">
                        <li th:each="step : ${setupSteps}" th:text="${step}">步骤</li>
                    </ol>
                </div>
            </div>

            <div class="c-card" style="margin-top:16px">
                <h2 class="c-card__title">下挂设备</h2>
                <p class="c-muted" style="font-size:13px">在「添加设备」时选择所属网关；遥测 JSON 中请带 <code>deviceId</code>（设备编号）与可选 <code>gatewayId</code>。</p>
                <div th:if="${#lists.isEmpty(childDevices)}" class="c-muted">暂无绑定设备。</div>
                <table class="c-table" th:if="${!#lists.isEmpty(childDevices)}">
                    <thead><tr><th>名称</th><th>编号</th><th>协议</th><th>状态</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="d : ${childDevices}">
                        <td th:text="${d.name}">-</td>
                        <td><code th:text="${d.deviceSn}">-</code></td>
                        <td th:text="${d.protocol}">-</td>
                        <td th:text="${d.status}">-</td>
                        <td><a th:href="@{/devices/{id}(id=${d.id})}">详情</a></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="fragments-console :: layout-scripts"></th:block>
</body>
</html>
