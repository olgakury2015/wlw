<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>登录 · 盖斯特控制台</title>
    <link rel="stylesheet" th:href="@{/css/console.css}"/>
</head>
<body class="console-body c-login-body">
<div class="c-login">
    <div class="c-login__card">
        <h1 class="c-login__title">盖斯特控制台</h1>
        <p class="c-login__hint">设备与数据统一接入 · 请登录</p>
        <div th:if="${msg}" class="c-alert c-alert--ok" th:text="${msg}"></div>
        <div th:if="${error}" class="c-alert c-alert--err" th:text="${error}"></div>
        <form th:action="@{/login}" method="post" class="c-login__form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label>用户名
                <input type="text" name="username" autocomplete="username" required autofocus/>
            </label>
            <label>密码
                <input type="password" name="password" autocomplete="current-password" required/>
            </label>
            <button type="submit" class="c-btn c-btn--primary c-login__btn">登录</button>
        </form>
        <p class="c-muted" style="margin-top:14px;font-size:12px">默认管理员 <code>admin</code> / <code>admin123</code>，只读用户 <code>user</code> / <code>user123</code>（首次启动自动创建）。</p>
    </div>
</div>
</body>
</html>
